# Regenerate VatioChat.xcodeproj with `xcodegen generate` from this folder.
name: VatioChat
options:
  bundleIdPrefix: ai.vatio
  deploymentTarget:
    iOS: "17.0"
packages:
  Vatio:
    url: https://github.com/vatio-ai/ios
    from: "0.5.0"
targets:
  VatioChat:
    type: application
    platform: iOS
    sources: [VatioChat]
    dependencies:
      - package: Vatio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.vatio.chat
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vatio Chat
        INFOPLIST_KEY_NSMicrophoneUsageDescription: To send voice notes to the agent.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
schemes:
  VatioChat:
    build:
      targets:
        VatioChat: all
    run:
      config: Debug
    archive:
      config: Release
